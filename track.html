<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحطة — تابع الرحلة</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1614"><meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
#map{height:46vh;min-height:240px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.steps{display:flex;flex-direction:column;gap:0}
.st{display:flex;gap:11px;align-items:flex-start;padding:8px 0;color:var(--muted)}
.st .b{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:5px;background:var(--surface)}
.st.on{color:var(--ink)} .st.on .b{background:var(--accent);border-color:var(--accent)}
.st small{display:block;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="/assets/logo.png" alt="" style="height:36px;width:auto;display:block">
      <div><h1>المحطة</h1><p class="sub">متابعة رحلة</p></div>
      <span class="chip c-ok" id="live" style="margin-inline-start:auto">● مباشر</span>
    </div>
    <div style="height:14px"></div>
  </header>

  <section class="stack">
    <div id="err" class="banner b-crit" hidden></div>
    <div class="card" id="card" hidden>
      <div id="alert" class="banner b-crit" hidden style="margin-bottom:10px;font-weight:700"></div>
      <h2 id="title" style="font-size:19px">—</h2>
      <div style="display:flex;gap:12px;align-items:center;margin-top:8px"><img id="ph" alt="" hidden style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:none"><p class="hint" id="drv" style="margin:0"></p></div>
      <div class="steps" style="margin-top:12px">
        <div class="st" id="s1"><span class="b"></span><div>طلب توكتوك<small id="t1"></small></div></div>
        <div class="st" id="s2"><span class="b"></span><div>سائق قبل وجاي<small id="t2"></small></div></div>
        <div class="st" id="s3"><span class="b"></span><div>ركب — في الطريق<small id="t3"></small></div></div>
        <div class="st" id="s4"><span class="b"></span><div>وصل بالسلامة<small id="t4"></small></div></div>
      </div>
    </div>
    <div id="eta" style="font-weight:700;color:var(--accent-ink);text-align:center;min-height:1.4em"></div>
    <div id="map"></div>
    <p class="hint" style="text-align:center">الصفحة دي مش بتبيّن أي أرقام تليفونات. التوكتوك بيتحدّث لوحده كل ثانيتين.</p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/common.js"></script>
<script>
(function(){
  "use strict";
  var $ = TT.$, q = new URLSearchParams(location.search);
  var id = q.get("id"), s = q.get("s"), dId = q.get("d"), map = null, drawn = false, timer = null, lv = { at:0 };
  function photo(d){ var p = $("ph"); if(d && d.photo){ if(p.getAttribute("src") !== d.photo) p.src = d.photo; p.hidden = false; } else p.hidden = true; }
  function stopAll(){ $("live").hidden = true; if(timer){ clearInterval(timer); timer = null; } }
  /* لينك السائق لأهله: مكانه وحالته بس */
  function loadDriver(){
    fetch("/api/share-driver/" + encodeURIComponent(dId) + "?s=" + encodeURIComponent(s || "")).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "خطأ"); return j; }); })
      .then(function(j){
        $("card").hidden = false; $("err").hidden = true; document.querySelector(".steps").hidden = true; photo(j.driver);
        $("title").textContent = j.driver.name + (j.online ? (j.onTrip ? " — في مشوار دلوقتي" : " — شغّال ومستني مشاوير") : " — مش شغّال دلوقتي");
        $("drv").textContent = j.driver.plate ? "توكتوك لوحة " + j.driver.plate : "";
        $("live").hidden = !j.online;
        if(!map){ map = TT.initMap("map"); }
        if(j.driverLoc){ var d = [j.driverLoc.lat, j.driverLoc.lng];
          if(!lv.drv){ lv.drv = L.marker(d, { icon:TT.driverIcon(j.driverLoc.h), interactive:false }).addTo(map); map.setView(d, 16); }
          else TT.glidePath(lv.drv, d, null, 2000, function(){}); }
        $("eta").textContent = j.at && !j.online ? "آخر مكان من " + Math.max(1, Math.round((Date.now() - j.at) / 60000)) + " دقيقة" : "";
      }).catch(function(e){ $("err").textContent = e.message; $("err").hidden = false; });
  }
  function hm(ts){ return ts ? new Date(ts).toLocaleTimeString("ar-EG", { hour:"numeric", minute:"2-digit" }) : ""; }
  function load(){
    fetch("/api/share/" + encodeURIComponent(id || "") + "?s=" + encodeURIComponent(s || ""))
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "خطأ"); return j; }); })
      .then(function(j){
        $("card").hidden = false; $("err").hidden = true;
        var who = j.rider || "الراكب";
        if(j.status === "closed"){ $("title").textContent = "الرحلة خلصت ✓ — اللينك ده اتقفل"; $("drv").textContent = "علشان خصوصية " + who + "، المتابعة بتقف بعد الوصول بربع ساعة."; document.querySelector(".steps").hidden = true; photo(null); stopAll(); return; }
        photo(j.driver);
        var al = $("alert"), msg = j.sos ? "⚠ " + who + " داس استغاثة — مكانه ظاهر على الخريطة. اتصل بيه أو بالنجدة ١٢٢" : j.anom ? (j.anom.kind === "route" ? "التوكتوك خرج عن الطريق المتوقع" : "التوكتوك واقف من شوية") + (j.anom.esc ? " و" + who + " مارَدّش — حاول تكلّمه" : " — بنسأل " + who + " لو كويس") : "";
        al.hidden = !msg; al.textContent = msg;
        if(j.riderLoc && map){ var rp = [j.riderLoc.lat, j.riderLoc.lng]; if(!lv.rider) lv.rider = L.circleMarker(rp, { radius:9, color:"#fff", weight:3, fillColor: j.sos ? "#A9382B" : "#2F6FD6", fillOpacity:1 }).addTo(map).bindTooltip(who + " (موبايله)"); else { lv.rider.setLatLng(rp); lv.rider.setStyle({ fillColor: j.sos ? "#A9382B" : "#2F6FD6" }); }
          /* مكان موبايله وقف يتبعت؟ نكتب من إمتى (والتوكتوك لايف جنبه) */
          var age = j.riderLoc.at ? Math.round((Date.now() - j.riderLoc.at) / 60000) : 0;
          lv.rider.setTooltipContent(age >= 1 ? "آخر مكان لموبايل " + who + " من " + age + " دقيقة" : who + " (موبايله)");
          lv.rider.setStyle({ fillOpacity: age >= 1 ? .45 : 1 }); }
        var st = j.status, started = Boolean(j.startedAt);
        $("title").textContent =
          st === "done" ? who + " وصل بالسلامة ✓" :
          st === "cancelled" ? "الرحلة اتلغت" :
          st === "assigned" ? (started ? who + " في الطريق لـ " + j.to.label : "السائق جاي لـ " + who) :
          "بندوّر على سائق لـ " + who;
        $("drv").textContent = j.driver ? ("مع " + j.driver.name + (j.driver.plate ? " · توكتوك لوحة " + j.driver.plate : "")) : "";
        var on = [true, Boolean(j.assignedAt) || st === "done", started || st === "done", st === "done"];
        ["s1","s2","s3","s4"].forEach(function(k, i){ $(k).classList.toggle("on", on[i]); });
        $("t1").textContent = hm(j.createdAt) + " · من " + j.from.label;
        $("t2").textContent = hm(j.assignedAt);
        $("t3").textContent = hm(j.startedAt);
        $("t4").textContent = st === "done" ? hm(j.finishedAt) + " · " + j.to.label : "";
        if((st === "done" || st === "cancelled") && !j.sos) $("live").hidden = true;
        if(!drawn && j.from.lat != null && j.to.lat != null){
          drawn = true;
          map = TT.initMap("map");
          var a = [j.from.lat, j.from.lng], b = [j.to.lat, j.to.lng];
          L.marker(a, { icon: TT.markerIcon("#0E7566", true) }).addTo(map).bindTooltip(j.from.label);
          L.marker(b, { icon: TT.markerIcon("#BC4E1E", true) }).addTo(map).bindTooltip(j.to.label);
          var pts = [a].concat((j.stops || []).map(function(x){ L.circleMarker([x.lat, x.lng], { radius:7, color:"#fff", weight:2, fillColor:"#C98A1B", fillOpacity:1 }).addTo(map).bindTooltip(x.label); return [x.lat, x.lng]; }), [b]);
          var line = L.polyline(pts, { color:"#0E7566", weight:4, opacity:.35, dashArray:"6 8" }).addTo(map);
          TT.fitRoute(map, line.getBounds());
        }
        live(j, st, started);
      })
      .catch(function(e){ $("err").textContent = e.message; $("err").hidden = false; });
  }
  /* التوكتوك لايف عند الأهل: بيتحدّث كل ثانيتين وبيمشي على المسار بين كل نقطة والتانية */
  function live(j, st, started){
    if(!map) return;
    var dl = j.driverLoc, tier = j.driver && j.driver.tier, phase = started ? 1 : 0, target = phase ? j.to : j.from;
    if(st !== "assigned" || !dl){ if(lv.drv){ map.removeLayer(lv.drv); lv.drv = null; } if(lv.line){ map.removeLayer(lv.line); lv.line = null; } $("eta").textContent = ""; return; }
    var d = [dl.lat, dl.lng];
    if(!lv.drv) lv.drv = L.marker(d, { icon:TT.driverIcon(dl.h, tier), interactive:false, zIndexOffset:1000 }).addTo(map);
    else if(!(lv.last && lv.last[0] === d[0] && lv.last[1] === d[1])) TT.glidePath(lv.drv, d, lv.coords, 2000, function(h){ var el = lv.drv.getElement && lv.drv.getElement(), tk = el && el.querySelector(".tk"); if(tk && TT.rotTo) TT.rotTo(tk, h); else lv.drv.setIcon(TT.driverIcon(h, tier)); });
    lv.last = d;
    if(!target || target.lat == null) return;
    var off = !lv.rt || lv.phase !== phase || TT.offRoute(lv.rt.coords, dl) > 80;
    if(!off) $("eta").textContent = (phase ? "هيوصل خلال " : "السائق هيوصل خلال ") + TT.etaText(TT.remain(lv.rt, dl));
    if(off && Date.now() - lv.at > (lv.rt && !lv.rt.road ? 30000 : 8000)){
      lv.at = Date.now(); lv.lp = dl; var ph = lv.phase; lv.phase = phase;
      TT.route(dl, target).then(function(rt){
        if(!lv.drv) return;
        lv.rt = rt;
        lv.coords = rt.road ? rt.coords : null;
        if(!lv.line) lv.line = TT.animRoute(map, rt.coords, phase ? "#BC4E1E" : "#131E1C"); else lv.line.setLatLngs(rt.coords);
        $("eta").textContent = (phase ? "هيوصل خلال " : "السائق هيوصل خلال ") + TT.etaText(rt);
        if(ph !== phase || !map.getBounds().pad(-0.12).contains(d)) TT.fitRoute(map, lv.line.getBounds().extend(d));
      });
    }
  }
  var go = dId ? loadDriver : load;
  go();
  timer = setInterval(function(){ if(!document.hidden) go(); }, dId ? 4000 : 2000);
})();
</script>
<a href="tel:122" aria-label="اتصل بالنجدة ١٢٢" style="position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:900;display:flex;align-items:center;gap:8px;background:#A9382B;color:#fff;text-decoration:none;border-radius:999px;padding:12px 18px;font:700 15px var(--body);min-height:48px;box-shadow:0 10px 24px -10px rgba(169,56,43,.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>النجدة ١٢٢</a>
</body>
</html>
