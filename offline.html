<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7566">
<title>المحطة — مفيش إنترنت</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body style="min-height:100vh;display:grid;place-items:center;background:#0E7566;color:#fff;text-align:center;padding:24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;max-width:320px">
    <img src="/assets/logo.png" alt="المحطة" style="height:72px;width:auto;filter:brightness(0) invert(1)">
    <h1 style="font-family:var(--display);font-size:22px;margin:8px 0 0">مفيش إنترنت دلوقتي</h1>
    <p style="margin:0;opacity:.9">اتأكد إن الواي فاي أو الباقة شغالين، وبعدين جرّب تاني.</p>
    <button onclick="location.reload()" style="margin-top:10px;font:700 16px var(--body);background:#fff;color:#0A5A4E;border:0;border-radius:12px;padding:13px 28px;cursor:pointer;min-height:48px">جرّب تاني</button>
  </div>
</body>
</html>
